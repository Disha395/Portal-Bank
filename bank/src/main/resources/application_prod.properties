spring.config.activate.on.profile=prod

spring.application.name=bank
logging.level.org.spring.framework.security=${SPRING_SECURITY_LOG_LEVEL:ERROR}


spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:bank}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}

logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

server.servlet.session.timeout=${SESSION_TIMEOUT:20m}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:http://localhost:8180/realms/portalbankdev/protocol/openid-connect/certs}



